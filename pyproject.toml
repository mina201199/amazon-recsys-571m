[project]
name = "amazon-recsys"
version = "0.1.0"
description = "大規模推薦系統：5.71 億筆 Amazon 評論（1996-2023），單機端到端"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- 資料處理：核心 ---
    "duckdb>=1.1",          # JSON 解析 + 超出記憶體的聚合，吃滿 20 執行緒
    "polars>=1.0",          # 特徵工程的 DataFrame 操作
    "pyarrow>=17.0",        # Parquet 讀寫

    # --- 模型 ---
    "lightgbm>=4.5",        # 排序層 (LambdaRank)
    "implicit>=0.7.2",      # 召回層 ALS 矩陣分解
    "threadpoolctl>=3.5",   # 限制 BLAS 執行緒，避免與 implicit 的平行搶佔
    "scipy>=1.14",          # 稀疏矩陣
    "numpy>=1.26",

    # --- 工具 ---
    "tqdm>=4.66",           # 進度條（下載與長時間任務要看得到進度）
    "httpx>=0.27",          # 平行下載
    "pyyaml>=6.0",          # 設定檔
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",      # 評估圖表
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_recsys"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 明確選定規則，而非依賴預設值——預設值會隨 ruff 版本改變
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import 排序
    "UP",       # 現代化語法
    "B",        # bugbear：常見陷阱
    "SIM",      # 可簡化的寫法
    "RUF",      # ruff 自有規則
]
ignore = [
    # RUF001-003 會把中文全形標點（，。：（））標記為「模糊字元」。
    # 該規則的用意是防範同形字攻擊（例如用西里爾字母 а 冒充拉丁 a），
    # 但本專案的註解與文件以中文撰寫，全形標點是正當用法。
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 腳本需先調整 sys.path 才能匯入專案模組，匯入必然在頂層程式碼之後
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: 需要連外網路的測試（uv run pytest -m 'not network' 可跳過）",
]
